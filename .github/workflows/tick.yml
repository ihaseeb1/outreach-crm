name: Cron tick

# Drives every background job: campaign sends, follow-ups, inbox polling,
# warmup, validation, health checks.
#
# Why this exists rather than Vercel's own cron: the Hobby plan only fires once
# a day. That is not merely slow, it caps throughput. Each mailbox must rest
# ~2 hours after a send, so a single tick can send at most one email per
# mailbox — one tick a day means ~7 emails a day regardless of the daily limits
# configured.
#
# Why each job is called separately rather than through /api/cron/tick: IMAP
# polling takes ~25s per mailbox, and a serial tick spent its whole 60s function
# budget there, deferring warmup, health, validation and scraping on virtually
# every run. Hitting the per-job endpoints in parallel gives each its own
# invocation and its own 60s, so slow mail polling can no longer crowd out
# everything else.
#
# GitHub's scheduled runs are best-effort and can be delayed by several minutes
# under load; that is fine here because every job is idempotent and simply
# picks up whatever is due.

on:
  schedule:
    - cron: "*/10 * * * *"
  # So it can be fired by hand from the Actions tab without waiting.
  workflow_dispatch:

# A slow run must never overlap itself: the batches claim rows with short
# locks, and piling runs up would just contend for the same work.
concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run every job in parallel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://crm.orankly.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set — add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi

          hit() {
            name="$1"
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w "%{http_code}" \
              --max-time 90 \
              -X POST "$BASE/api/cron/$name" \
              -H "Authorization: Bearer $CRON_SECRET") || code="000"
            echo "=== $name -> HTTP $code"
            head -c 800 "$body"
            echo
            # Recorded per job rather than failing the whole run, so one flaky
            # endpoint does not hide the others' results.
            echo "$code" > "status-$name"
          }

          # Sending first so it is never blocked behind mail polling.
          hit campaigns &
          hit warmup &
          hit inbound &
          hit health &
          hit validate &
          hit scrape &
          wait

          failed=""
          for f in status-*; do
            job="${f#status-}"
            code=$(cat "$f")
            [ "$code" = "200" ] || failed="$failed $job($code)"
          done

          if [ -n "$failed" ]; then
            echo "Failed jobs:$failed"
            exit 1
          fi
          echo "All jobs returned 200."
